<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone List · Gas Agency</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (for extra polish) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(145deg, #f0f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem 0;
        }

        .zone-card {
            border: none;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 50px -8px rgba(13, 110, 253, 0.10), 0 8px 24px rgba(0,0,0,0.04);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .zone-card:hover {
            transform: translateY(-4px);
        }

        .card-header-custom {
            background: linear-gradient(145deg, #0d6efd, #0a58ca);
            padding: 1.2rem 1.5rem;
            border-bottom: none;
        }

        .card-header-custom h3 {
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-header-custom h3 i {
            font-size: 1.8rem;
            color: #ffc107;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #f8fafc;
            color: #0b2a4a;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding: 14px 12px;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .table tbody td {
            padding: 14px 12px;
            vertical-align: middle;
            border-bottom: 1px solid #edf2f7;
        }

        .table tbody tr:hover {
            background: rgba(13, 110, 253, 0.03);
        }

        .btn-sm-custom {
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-warning-custom {
            background: linear-gradient(145deg, #ffc107, #e0a800);
            border: none;
            color: #1a2634;
        }

        .btn-warning-custom:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
            color: #1a2634;
        }

        .btn-danger-custom {
            background: linear-gradient(145deg, #dc3545, #b02a37);
            border: none;
            color: white;
        }

        .btn-danger-custom:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
            color: white;
        }

        .empty-state {
            padding: 2.5rem 0;
            color: #6c7e8f;
        }

        .empty-state i {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            color: #b0c4d9;
        }

        /* zone id badge */
        .zone-id-badge {
            background: #eef2f7;
            color: #2c3e50;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }

        @media (max-width: 576px) {
            .table thead th,
            .table tbody td {
                padding: 10px 8px;
                font-size: 0.85rem;
            }
            .btn-sm-custom {
                padding: 4px 12px;
                font-size: 0.78rem;
            }
            .card-header-custom h3 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    {% include 'header.html' %}
    

<div class="container mt-5 pt-5">

    <div class="zone-card card border-0 shadow-sm">

        <!-- Card Header -->
        <div class="card-header-custom text-white">
            <h3>
                <i class="bi bi-list-ul"></i>
                Zone List
                <span class="badge bg-white text-primary ms-2" style="font-size:0.8rem; border-radius:40px;">
                    {{ Zones|length }}
                </span>
            </h3>
        </div>

        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle mb-0">

                    <thead>
                        <tr>
                            <th style="width:15%;">Zone ID</th>
                            <th style="width:45%;">Zone Name</th>
                            <th class="text-center" style="width:20%;">Edit</th>
                            <th class="text-center" style="width:20%;">Delete</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for z in Zones %}

                        <tr>
                            <td>
                                <span class="zone-id-badge">
                                    <i class="bi bi-hash"></i> {{ forloop.counter }}
                                </span>
                            </td>
                            <td>
                                <i class="bi bi-geo-alt text-primary me-2"></i>
                                {{ z.zone }}
                            </td>

                            <td class="text-center">
                                <a href="{% url 'editzone' z.id %}"
                                   class="btn btn-sm btn-warning-custom btn-sm-custom">
                                    <i class="bi bi-pencil-square"></i> Edit
                                </a>
                            </td>

                            <td class="text-center">
                                <a href="{% url 'deleteZone' z.id %}"
                                   class="btn btn-sm btn-danger-custom btn-sm-custom"
                                   onclick="return confirm('Delete this zone?')">
                                    <i class="bi bi-trash3"></i> Delete
                                </a>
                            </td>
                        </tr>

                        {% empty %}

                        <tr>
                            <td colspan="4" class="text-center empty-state">
                                <i class="bi bi-inbox"></i>
                                <span class="d-block fw-semibold">No zones available.</span>
                                <span class="text-muted small">Add a new zone to get started.</span>
                            </td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>
            </div>

        </div>

        <!-- optional footer with add zone link -->
        <div class="card-footer bg-transparent border-0 text-center py-3">
            <a href="{% url 'zone' %}" class="text-decoration-none fw-semibold text-primary">
                <i class="bi bi-plus-circle"></i> Add New Zone
            </a>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
