<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Zone · Gas Agency</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons (for extra style) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .zone-card {
            border: none;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 50px -8px rgba(13, 110, 253, 0.12), 0 8px 24px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            max-width: 650px;
            margin: 0 auto;
            padding: 2rem 2rem 2.5rem;
        }

        .zone-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(13, 110, 253, 0.18);
        }

        .page-title {
            color: #0b2a4a;
            font-weight: 700;
            letter-spacing: -0.3px;
            border-bottom: 3px solid #0d6efd;
            padding-bottom: 12px;
            display: inline-block;
            margin-bottom: 1.8rem;
        }

        .page-title i {
            color: #f97316;
            margin-right: 8px;
        }

        .form-label-custom {
            font-weight: 600;
            color: #1f3a4b;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: block;
        }

        .form-control-lg-custom {
            border-radius: 40px;
            padding: 14px 22px;
            border: 1px solid #dce2e9;
            background: #f8fafc;
            transition: 0.2s;
            font-size: 1rem;
            width: 100%;
        }

        .form-control-lg-custom:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.10);
            background: white;
            outline: none;
        }

        .btn-success-custom {
            border-radius: 40px;
            padding: 12px 36px;
            font-weight: 600;
            background: linear-gradient(145deg, #198754, #157347);
            border: none;
            transition: 0.2s;
            letter-spacing: 0.3px;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }

        .btn-success-custom:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(25, 135, 84, 0.3);
        }

        .input-group-custom {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
        }

        .input-group-custom .form-control {
            flex: 1 1 220px;
        }

        .input-group-custom .btn {
            flex: 0 0 auto;
        }

        @media (max-width: 576px) {
            .zone-card {
                padding: 1.5rem;
                margin: 1rem;
            }
            .input-group-custom {
                flex-direction: column;
                align-items: stretch;
            }
            .input-group-custom .btn {
                width: 100%;
            }
        }

        /* small helper */
        .required-asterisk {
            color: #dc3545;
            margin-left: 2px;
        }
    </style>
</head>
<body>
    {% include 'header.html' %}

    <div class="container mt-5 pt-5">
        <div class="zone-card shadow p-4">

            <!-- Heading with icon -->
            <h1 class="text-center fw-bold page-title">
                <i class="bi bi-plus-circle"></i> Create Zone
            </h1>

            <!-- form -->
            <form action="{% url 'zone' %}" method="POST">
                {% csrf_token %}

                <div class="input-group-custom">
                    <!-- label + input (inline on large screens, stacked on small) -->
                    <div style="flex: 1 1 100%;">
                        <label class="form-label-custom">
                            <i class="bi bi-geo-alt"></i> Zone Name <span class="required-asterisk">*</span>
                        </label>
                        <input
                            class="form-control form-control-lg-custom"
                            type="text"
                            placeholder="e.g. North Zone, South Zone"
                            aria-label="Create Zone"
                            name="zone"
                            required
                        />
                    </div>

                    <button type="submit" class="btn btn-success btn-success-custom">
                        <i class="bi bi-plus-circle me-1"></i> Add
                    </button>
                </div>

                <!-- optional help text -->
                <small class="text-muted d-block mt-3">
                    <i class="bi bi-info-circle"></i> Enter a unique zone name for your gas agency.
                </small>

            </form>

            <!-- extra: back link (optional, but user-friendly) -->
            <div class="mt-4 pt-2 text-center">
                <a href="{% url 'viewZone' %}" class="text-decoration-none text-secondary">
                    <i class="bi bi-arrow-left"></i> View all zones
                </a>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS (already included via integrity) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
