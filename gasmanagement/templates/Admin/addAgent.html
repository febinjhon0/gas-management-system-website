<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Agent · Gas Agency</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(145deg, #f0f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem 0;
        }

        .agent-card {
            border: none;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 50px -8px rgba(13, 110, 253, 0.10), 0 8px 24px rgba(0,0,0,0.04);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .agent-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(13, 110, 253, 0.15);
        }

        .card-header-custom {
            background: linear-gradient(135deg, #198754, #157347);
            color: white;
            padding: 1.2rem 1.5rem;
            border-bottom: none;
            position: relative;
            overflow: hidden;
        }

        .card-header-custom::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }

        .card-header-custom h3 {
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .card-header-custom h3 i {
            font-size: 1.8rem;
            color: #ffc107;
        }

        .form-label-custom {
            font-weight: 600;
            color: #1f3a4b;
            font-size: 0.92rem;
            margin-bottom: 4px;
            display: block;
        }

        .form-label-custom i {
            color: #198754;
            margin-right: 6px;
            width: 20px;
        }

        .form-control-custom {
            border-radius: 40px;
            padding: 12px 20px;
            border: 1px solid #dce2e9;
            background: #f8fafc;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        .form-control-custom:focus {
            border-color: #198754;
            box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.10);
            background: white;
            outline: none;
        }

        .btn-success-custom {
            border-radius: 40px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #198754, #157347);
            border: none;
            transition: 0.25s;
            letter-spacing: 0.3px;
            font-size: 1rem;
            box-shadow: 0 4px 16px rgba(25, 135, 84, 0.2);
        }

        .btn-success-custom:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 28px rgba(25, 135, 84, 0.3);
        }

        .btn-success-custom i {
            margin-right: 8px;
        }

        .required-asterisk {
            color: #dc3545;
            margin-left: 2px;
        }

        .card-footer-custom {
            background: transparent;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1rem 1.5rem;
        }

        .btn-secondary-custom {
            border-radius: 40px;
            padding: 10px 24px;
            font-weight: 600;
            background: transparent;
            border: 2px solid #6c7e8f;
            color: #4a5b6b;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-secondary-custom:hover {
            background: #f0f4f8;
            border-color: #4a5b6b;
            color: #1f2e3b;
        }

        @media (max-width: 576px) {
            .agent-card {
                margin: 0 0.8rem;
            }
            .card-header-custom h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    {% include 'header.html' %}

<div class="container mt-5 pt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="agent-card card shadow-lg">

                <!-- Card Header -->
                <div class="card-header-custom">
                    <h3>
                        <i class="bi bi-person-plus"></i>
                        Add Agent
                    </h3>
                </div>

                <!-- Card Body -->
                <div class="card-body p-4">

                    <form action="{% url 'addAgent' %}" method="POST" onsubmit="return validateForm()">
                        {% csrf_token %}

                        <!-- Agent Name -->
                        <div class="mb-3">
                            <label class="form-label-custom">
                                <i class="bi bi-person"></i> Agent Name <span class="required-asterisk">*</span>
                            </label>
                            <input type="text" class="form-control form-control-custom" placeholder="Enter Agent Name" name="name" id="name" required>
                        </div>

                        <div class="row">

                            <!-- Age -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label-custom">
                                    <i class="bi bi-calendar"></i> Age <span class="required-asterisk">*</span>
                                </label>
                                <input type="number" class="form-control form-control-custom" placeholder="Enter Age" name="age" id="age" required>
                            </div>

                            <!-- Licence No -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label-custom">
                                    <i class="bi bi-card-text"></i> Licence No <span class="required-asterisk">*</span>
                                </label>
                                <input type="text" class="form-control form-control-custom" placeholder="Enter Licence Number" name="licence" id="licence" required>
                            </div>

                        </div>

                        <div class="row">

                            <!-- Phone -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label-custom">
                                    <i class="bi bi-telephone"></i> Phone <span class="required-asterisk">*</span>
                                </label>
                                <input type="tel" class="form-control form-control-custom" placeholder="Enter Phone Number" name="phone" id="phone" required>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label-custom">
                                    <i class="bi bi-envelope"></i> Email <span class="required-asterisk">*</span>
                                </label>
                                <input type="email" class="form-control form-control-custom" placeholder="Enter Email" name="email" id="email" required>
                            </div>

                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label class="form-label-custom">
                                <i class="bi bi-geo-alt"></i> Location <span class="required-asterisk">*</span>
                            </label>
                            <input type="text" class="form-control form-control-custom" placeholder="Enter Location" name="location" id="location" required>
                        </div>

                        <!-- Joining Date -->
                        <div class="mb-4">
                            <label class="form-label-custom">
                                <i class="bi bi-calendar-plus"></i> Joining Date <span class="required-asterisk">*</span>
                            </label>
                            <input type="date" class="form-control form-control-custom" name="date" id="date" required>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success-custom btn-lg">
                                <i class="bi bi-check2-circle"></i> Add Agent
                            </button>
                        </div>

                    </form>

                </div>

                <!-- Card Footer -->
                <div class="card-footer-custom d-flex justify-content-between align-items-center">
                    <a href="{% url 'manageAgent' %}" class="btn-secondary-custom">
                        <i class="bi bi-arrow-left"></i> Back to Agents
                    </a>
                    <span class="text-muted small">
                        <i class="bi bi-info-circle"></i> Fill all fields
                    </span>
                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- ====== VALIDATION SCRIPT ====== -->
<script>
    function validateForm() {

        let name = document.getElementById("name").value.trim();
        let age = document.getElementById("age").value;
        let licence = document.getElementById("licence").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let email = document.getElementById("email").value.trim();
        let location = document.getElementById("location").value.trim();
        let date = document.getElementById("date").value;

        // Name
        if (!/^[A-Za-z ]{3,30}$/.test(name)) {
            alert("Agent name should contain only letters (3-30 characters).");
            return false;
        }

        // Age
        if (age < 18 || age > 60) {
            alert("Age must be between 18 and 60.");
            return false;
        }

        // Licence
        if (!/^[A-Za-z0-9]{6,20}$/.test(licence)) {
            alert("Licence number must contain only letters and numbers (6-20 characters).");
            return false;
        }

        // Phone
        if (!/^[6-9][0-9]{9}$/.test(phone)) {
            alert("Enter a valid 10-digit mobile number.");
            return false;
        }

        // Email
        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
            alert("Enter a valid email address.");
            return false;
        }

        // Location
        if (!/^[A-Za-z ]{3,50}$/.test(location)) {
            alert("Location should contain only letters.");
            return false;
        }

        // Date
        if (date == "") {
            alert("Please select the joining date.");
            return false;
        }

        return true;
    }
</script>

</body>
</html>
