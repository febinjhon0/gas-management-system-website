<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Cylinder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    {% include 'header.html' %}
   

<div class="container py-5 mt-5 pt-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">Edit Cylinder</h3>
                </div>

                <div class="card-body">

                    <form action="{% url 'editcylinder' cylinder.id %}" method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Cylinder Type</label>
                            <input
                                type="text"
                                class="form-control"
                                name="type"
                                value="{{ cylinder.Type }}"
                                placeholder="Cylinder Type"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cylinder Price</label>
                            <input
                                type="text"
                                class="form-control"
                                name="price"
                                value="{{ cylinder.Price }}"
                                placeholder="Cylinder Price"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Availability</label>
                            <input
                                type="text"
                                class="form-control"
                                name="avail"
                                value="{{ cylinder.Available }}"
                                placeholder="Availability"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Net Weight</label>
                            <input
                                type="text"
                                class="form-control"
                                name="net"
                                value="{{ cylinder.Net }}"
                                placeholder="Net Weight"
                                required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Update Cylinder
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
