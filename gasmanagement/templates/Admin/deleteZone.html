<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Zone · Gas Agency</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(145deg, #f0f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* main content area */
        .delete-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .delete-card {
            border: none;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 50px -8px rgba(220, 53, 69, 0.12), 0 8px 24px rgba(0,0,0,0.04);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .delete-card:hover {
            transform: translateY(-4px);
        }

        .delete-icon {
            font-size: 4rem;
            color: #dc3545;
            background: rgba(220, 53, 69, 0.08);
            padding: 18px;
            border-radius: 60px;
            display: inline-block;
            margin-bottom: 16px;
            line-height: 1;
        }

        .delete-title {
            color: #0b2a4a;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .delete-message {
            font-size: 1.1rem;
            font-weight: 500;
            color: #1f3a4b;
            padding: 16px 20px;
            background: rgba(220, 53, 69, 0.06);
            border-radius: 40px;
            border-left: 4px solid #dc3545;
            margin: 20px 0 28px;
            display: inline-block;
        }

        .delete-message i {
            color: #dc3545;
            margin-right: 8px;
        }

        .btn-delete {
            border-radius: 40px;
            padding: 12px 40px;
            font-weight: 600;
            background: linear-gradient(145deg, #dc3545, #b02a37);
            border: none;
            color: white;
            transition: 0.2s;
            font-size: 1.05rem;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 14px rgba(220, 53, 69, 0.2);
        }

        .btn-delete:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 28px rgba(220, 53, 69, 0.3);
            color: white;
        }

        .btn-delete i {
            margin-right: 8px;
        }

        .btn-cancel {
            border-radius: 40px;
            padding: 12px 32px;
            font-weight: 600;
            background: transparent;
            border: 2px solid #6c7e8f;
            color: #4a5b6b;
            transition: 0.2s;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn-cancel:hover {
            background: #f0f4f8;
            border-color: #4a5b6b;
            color: #1f2e3b;
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 10px;
        }

        /* zone name badge (if passed) */
        .zone-badge {
            background: #eef2f7;
            color: #0b2a4a;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            display: inline-block;
            margin-top: 4px;
        }

        @media (max-width: 576px) {
            .delete-card {
                padding: 1.8rem 1.2rem;
                margin: 0 0.8rem;
            }
            .delete-title {
                font-size: 1.3rem;
            }
            .delete-message {
                font-size: 1rem;
                padding: 12px 16px;
            }
            .btn-delete, .btn-cancel {
                width: 100%;
                text-align: center;
            }
            .action-group {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>


    <!-- ====== MAIN CONTENT ====== -->
    <div class="delete-wrapper">
        <div class="delete-card shadow">

            <!-- Icon -->
            <div class="delete-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>

            <!-- Title -->
            <h2 class="delete-title">
                Confirm Deletion
            </h2>

            <!-- Zone name (optional) -->
            {% if edit.zone %}
                <span class="zone-badge">
                    <i class="bi bi-geo-alt me-1"></i> {{ edit.zone }}
                </span>
            {% endif %}

            <!-- Warning message (exactly as provided, with extra styling) -->
            <div class="delete-message">
                <i class="bi bi-shield-exclamation"></i>
                Do you wish to delete?
            </div>

            <!-- Form with delete button -->
            <form action="{% url 'deleteZone' edit.id %}" method="POST">
                {% csrf_token %}

                <div class="action-group">
                    <!-- Delete button -->
                    <button type="submit" class="btn btn-delete">
                        <i class="bi bi-trash3"></i> Delete
                    </button>

                    <!-- Cancel link (go back to zone list) -->
                    <a href="{% url 'viewZone' %}" class="btn-cancel">
                        <i class="bi bi-arrow-left"></i> Cancel
                    </a>
                </div>

            </form>

            <!-- extra hint -->
            <p class="text-muted small mt-4 mb-0">
                <i class="bi bi-info-circle"></i> This action cannot be undone.
            </p>

        </div>
    </div>

</body>
</html>
