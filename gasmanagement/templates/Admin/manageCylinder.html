<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Cylinders · Gas Agency</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (for extra style) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(145deg, #f0f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .cylinder-card {
            border: none;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 50px -8px rgba(13, 110, 253, 0.10), 0 8px 24px rgba(0,0,0,0.04);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .cylinder-card:hover {
            transform: translateY(-4px);
        }

        .card-header-custom {
            background: linear-gradient(145deg, #0d6efd, #0a58ca);
            padding: 1.2rem 1.5rem;
            border-bottom: none;
        }

        .card-header-custom h4 {
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-header-custom h4 i {
            font-size: 1.6rem;
            color: #ffc107;
        }

        .form-label-custom {
            font-weight: 600;
            color: #1f3a4b;
            font-size: 0.92rem;
            margin-bottom: 4px;
            display: block;
        }

        .form-label-custom i {
            color: #0d6efd;
            margin-right: 6px;
            width: 20px;
        }

        .form-control-custom {
            border-radius: 40px;
            padding: 12px 20px;
            border: 1px solid #dce2e9;
            background: #f8fafc;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        .form-control-custom:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.10);
            background: white;
            outline: none;
        }

        .btn-success-custom {
            border-radius: 40px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(145deg, #198754, #157347);
            border: none;
            transition: 0.2s;
            letter-spacing: 0.3px;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }

        .btn-success-custom:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 24px rgba(25, 135, 84, 0.3);
        }

        .btn-success-custom i {
            margin-right: 8px;
        }

        /* small helper */
        .required-asterisk {
            color: #dc3545;
            margin-left: 2px;
        }

        @media (max-width: 576px) {
            .cylinder-card {
                margin: 0 0.8rem;
            }
            .card-header-custom h4 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    {% include 'header.html' %}
   

<div class="container mt-5 pt-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="cylinder-card card shadow-sm">

                <!-- Card Header -->
                <div class="card-header-custom text-white">
                    <h4>
                        <i class="bi bi-speedometer2"></i>
                        Manage Cylinders
                    </h4>
                </div>

                <!-- Card Body -->
                <div class="card-body p-4">

                    <form action="{% url 'manageCylinder' %}" method="POST" onsubmit="return showMessage()">
                        {% csrf_token %}

                        <!-- Cylinder Type -->
                        <div class="mb-3">
                            <label class="form-label-custom">
                                <i class="bi bi-tag"></i> Cylinder Type <span class="required-asterisk">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-custom"
                                   name="type"
                                   placeholder="e.g. 14.2 kg"
                                   required>
                        </div>

                        <!-- Cylinder Price -->
                        <div class="mb-3">
                            <label class="form-label-custom">
                                <i class="bi bi-currency-rupee"></i> Cylinder Price <span class="required-asterisk">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-custom"
                                   name="price"
                                   placeholder="e.g. 950"
                                   required>
                        </div>

                        <!-- Net Weight -->
                        <div class="mb-3">
                            <label class="form-label-custom">
                                <i class="bi bi-weight-scale"></i> Net Weight <span class="required-asterisk">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-custom"
                                   name="net"
                                   placeholder="e.g. 14.2 kg"
                                   required>
                        </div>

                        <!-- Availability -->
                        <div class="mb-4">
                            <label class="form-label-custom">
                                <i class="bi bi-check-circle"></i> Availability <span class="required-asterisk">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-custom"
                                   name="avail"
                                   placeholder="e.g. In Stock / Out of Stock"
                                   required>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success-custom">
                                <i class="bi bi-check2-circle"></i> Done
                            </button>
                        </div>

                    </form>

                    <!-- extra: link to view cylinders -->
                    <div class="text-center mt-3">
                        <a href="{% url 'viewCylinder' %}" class="text-decoration-none text-secondary small">
                            <i class="bi bi-eye"></i> View all cylinders
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- ====== SCRIPT (with alert message) ====== -->
<script>
    function showMessage(){
        alert("Cylinder added successfully!");
        return true;
    }
</script>

</body>
</html>
