<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accepted Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include 'Agent/agentheader.html' %}

<div class="container mt-4">
    <h3 class="text-center mb-3">Accepted Orders</h3>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Customer</th>
                <th>Cylinder</th>
                <th>Price</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for o in order %}
            <tr>
                <td>{{ o.booking.user.Name }}</td>
                <td>{{ o.booking.cylinder.Type }}</td>
                <td>{{ o.booking.price }}</td>
                <td>{{ o.booking.bookingdate }}</td>
                <td>{{ o.status }}</td>
                <td><a href="/complete_post/{{o.booking.id}}/">Complete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No accepted orders.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
