<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">🚚 Gas Agent</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'viewAssigned' %}">
                        Assigned Booking
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'acceptedOrder' %}">
                        Accepted Orders
                    </a>
                </li>
<li class="nav-item">
                    <a class="nav-link" href="/complete_get/">
                        finsh
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm" href="{% url 'logoutPage' %}">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-body text-center">
            <h2 class="fw-bold text-primary">Welcome {{agent.Name}}</h2>
            <p class="text-muted">
                Manage assigned bookings, notifications, pricing, and deliveries from the navigation bar.
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
