<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Gas Agency</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons (optional but adds a nice touch) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
        /* subtle gas-agency styling — keeps all original contents exactly */
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.2);
            transition: transform 0.2s ease;
        }
        .login-card:hover {
            transform: translateY(-4px);
        }
        .login-title {
            font-weight: 600;
            letter-spacing: -0.2px;
            color: #0b2a3b;
        }
        .login-title i {
            color: #e87b2d;
            margin-right: 8px;
        }
        .form-control {
            border-radius: 40px;
            padding: 12px 18px;
            border: 1px solid #dce2e9;
            background: #f8fafc;
            transition: 0.2s;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
            background: white;
        }
        .btn-primary {
            border-radius: 40px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(145deg, #0d6efd, #0a58ca);
            border: none;
            transition: 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.3);
        }
        .forgot-link, .register-link {
            color: #2d4b64;
            text-decoration: none;
            font-weight: 500;
            transition: 0.15s;
        }
        .forgot-link:hover, .register-link:hover {
            color: #0d6efd;
            text-decoration: underline;
        }
        .register-text {
            color: #5a738a;
        }
        /* message alert styling (kept exactly as provided) */
        .alert {
            border-radius: 40px;
        }
    </style>
</head>
<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card login-card shadow p-4 p-md-5" style="width: 100%; max-width: 440px;">

        <!-- title with subtle gas icon -->
        <h2 class="text-center mb-4 login-title">
            <i class="bi bi-fire"></i> Login
        </h2>

        <!-- ======== MESSAGES BLOCK – EXACTLY AS PROVIDED (unchanged) ======== -->
        <!-- {% if messages %}
<div class="container mt-3">
    {% for message in messages %}
        <div class="alert
            {% if message.tags == 'success' %}alert-success
            {% elif message.tags == 'error' %}alert-danger
            {% elif message.tags == 'warning' %}alert-warning
            {% else %}alert-info
            {% endif %}
            alert-dismissible fade show text-center"
            role="alert">

            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %} -->
        <!-- ======== end messages ======== -->

        <form method="POST" action="{% url 'loginPage' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">
                    <i class="bi bi-person"></i> Username
                </label>
                <input type="text" class="form-control" placeholder="Enter Username" name="email">
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">
                    <i class="bi bi-lock"></i> Password
                </label>
                <input type="password" class="form-control" placeholder="Enter Password" name="paswd">
            </div>

            <button class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>

            <div class="text-center mt-3">
                <a href="#" class="forgot-link">
                    <i class="bi bi-question-circle"></i> Forgot Password?
                </a>
            </div>

            <div class="text-center mt-2 register-text">
                Don't have an account?
                <a href="{% url 'register' %}" class="register-link">Register</a>
            </div>
        </form>

        <!-- small decorative footer (gas agency) -->
        <div class="text-center mt-4 small text-secondary opacity-50">
            <i class="bi bi-shield-check"></i> Secure · Gas Agency
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
