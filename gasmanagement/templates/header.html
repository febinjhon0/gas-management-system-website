<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts for extra elegance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e8f0fe 0%, #d4e4f7 100%);
            min-height: 100vh;
        }

        /* ====== NAVBAR ====== */
        .navbar {
            background: linear-gradient(135deg, #0b1a2a 0%, #1a3a4a 50%, #2c5364 100%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border-bottom: 2px solid rgba(255, 193, 7, 0.15);
            padding: 12px 0;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: 700;
            color: white !important;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .navbar-brand:hover {
            transform: scale(1.02);
            color: #ffc107 !important;
        }

        .navbar-brand i {
            color: #ffc107;
            margin-right: 8px;
            filter: drop-shadow(0 0 8px rgba(255, 193, 7, 0.3));
        }

        .nav-link {
            color: rgba(255,255,255,0.85) !important;
            font-weight: 500;
            margin-right: 6px;
            padding: 8px 16px !important;
            border-radius: 40px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #ffc107 !important;
            background: rgba(255, 193, 7, 0.10);
            transform: translateY(-2px);
        }

        .nav-link i {
            margin-right: 6px;
            font-size: 1.1rem;
        }

        .dropdown-menu {
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 8px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dropdown-item {
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 500;
            color: #1a2a3a;
            transition: 0.25s;
        }

        .dropdown-item:hover {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            transform: translateX(4px);
        }

        .dropdown-item i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .logout-btn {
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #dc3545, #b02a37);
            border: none;
            transition: 0.3s;
            box-shadow: 0 4px 16px rgba(220, 53, 69, 0.25);
        }

        .logout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 28px rgba(220, 53, 69, 0.35);
        }

        /* ====== DASHBOARD CONTENT ====== */
        .dashboard-wrapper {
            padding: 2rem 0 3rem;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: none;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0,0,0,0.03);
            padding: 2.5rem 2rem;
            transition: 0.3s;
        }

        .welcome-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.08);
        }

        .welcome-card h2 {
            font-weight: 700;
            color: #0b1a2a;
            letter-spacing: -0.5px;
        }

        .welcome-card h2 i {
            color: #f97316;
            background: rgba(249, 115, 22, 0.12);
            padding: 8px 14px;
            border-radius: 60px;
            margin-right: 10px;
            font-size: 2rem;
        }

        .welcome-card .lead-text {
            color: #3d5a73;
            font-size: 1.1rem;
        }

        .stat-card {
            background: white;
            border: none;
            border-radius: 24px;
            padding: 1.8rem 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            border-radius: 24px 24px 0 0;
        }

        .stat-card:nth-child(1)::before { background: linear-gradient(90deg, #0d6efd, #0a58ca); }
        .stat-card:nth-child(2)::before { background: linear-gradient(90deg, #198754, #157347); }
        .stat-card:nth-child(3)::before { background: linear-gradient(90deg, #ffc107, #e0a800); }
        .stat-card:nth-child(4)::before { background: linear-gradient(90deg, #0dcaf0, #0aa2c9); }

        .stat-icon {
            font-size: 2.8rem;
            display: inline-block;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .stat-icon.blue { background: rgba(13, 110, 253, 0.10); color: #0d6efd; }
        .stat-icon.green { background: rgba(25, 135, 84, 0.10); color: #198754; }
        .stat-icon.yellow { background: rgba(255, 193, 7, 0.12); color: #e0a800; }
        .stat-icon.cyan { background: rgba(13, 202, 240, 0.12); color: #0aa2c9; }

        .stat-card h5 {
            font-weight: 700;
            color: #0b1a2a;
            margin-bottom: 4px;
        }

        .stat-card p {
            color: #6c7e8f;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        /* divider */
        .divider-custom {
            border: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(13, 110, 253, 0.15), transparent);
            margin: 1.5rem 0;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 992px) {
            .navbar-brand { font-size: 22px; }
            .nav-link { padding: 6px 12px !important; font-size: 0.9rem; }
            .welcome-card { padding: 1.8rem 1.2rem; }
        }

        @media (max-width: 576px) {
            .stat-card { padding: 1.2rem 0.8rem; }
            .stat-icon { font-size: 2rem; padding: 8px; }
            .welcome-card h2 { font-size: 1.4rem; }
        }
    </style>

</head>
